spring:
  application:
    name: doppsy-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/doppsy
    username: doppsy_user
    password: doppsy_secret
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 20000
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      pool-name: DoppsyHikariPool

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC
    open-in-view: false

  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}
    listener:
      simple:
        auto-startup: ${DOPPSY_RABBIT_LISTENER_AUTO_STARTUP:true}
        concurrency: 2
        max-concurrency: 5
        prefetch: 1

server:
  port: 8080
  address: 0.0.0.0
  error:
    include-message: always
    include-binding-errors: always

logging:
  level:
    com.doppsy: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql: TRACE

# ---------------------------------------------------------------------------
# Doppsy custom config
# ---------------------------------------------------------------------------
