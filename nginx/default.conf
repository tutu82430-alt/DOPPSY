# ==============================================================================
# Doppsy Production Nginx Reverse Proxy with Let's Encrypt SSL
# ==============================================================================

upstream backend_service {
    server backend:8080;
    keepalive 32;
}

upstream frontend_service {
    server frontend:3000;
    keepalive 32;
}

# ------------------------------------------------------------------------------
# HTTP (Port 80): ACME Webroot Challenge & Automatic HTTPS Redirect
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name doppsy.in api.doppsy.in www.doppsy.in localhost _;

    # Let's Encrypt ACME challenge webroot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # Redirect all HTTP requests to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# HTTPS (Port 443): SSL Termination & Application Gateway
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name doppsy.in api.doppsy.in www.doppsy.in;

    # SSL Certificates (mounted from certbot volume)
    ssl_certificate /etc/letsencrypt/live/doppsy.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/doppsy.in/privkey.pem;

    # SSL Security & Hardening (TLS 1.2 & 1.3 only)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384";
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HTTP Strict Transport Security & Security Headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Performance & Gzip
    gzip on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Maximum file upload size (health records & documents)
    client_max_body_size 50M;

    # --------------------------------------------------------------------------
    # Route /api/ traffic to Spring Boot backend (including WhatsApp Webhook)
    # --------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://backend_service;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;

        # Timeouts for zero-wait concurrency operations & webhooks
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        proxy_buffering off;
    }

    # --------------------------------------------------------------------------
    # Route Next.js static asset optimizations
    # --------------------------------------------------------------------------
    location /_next/static/ {
        proxy_pass http://frontend_service;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        expires 365d;
        access_log off;
    }

    # --------------------------------------------------------------------------
    # Route all other web traffic to Next.js frontend
    # --------------------------------------------------------------------------
    location / {
        proxy_pass http://frontend_service;
        proxy_http_version 1.1;

        # WebSocket support for Next.js hot-reload / real-time updates
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Health check endpoint
    location /healthz {
        access_log off;
        return 200 "healthy\n";
    }
}
