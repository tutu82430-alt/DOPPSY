# ==============================================================================
# Doppsy Production Nginx Reverse Proxy Gateway
# ==============================================================================
# Routes public traffic:
#   - /api/        -> Spring Boot Backend API (port 8080)
#   - /            -> Next.js Frontend App (port 3000)
#   - /_next/      -> Next.js Static Asset Optimization
# ==============================================================================

upstream backend_service {
    server backend:8080;
    keepalive 32;
}

upstream frontend_service {
    server frontend:3000;
    keepalive 32;
}

# ------------------------------------------------------------------------------
# HTTP (Port 80): Primary Reverse Proxy & Let's Encrypt ACME Challenge
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name doppsy.in api.doppsy.in www.doppsy.in localhost _;

    # Performance & Gzip Compression
    gzip on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Maximum file upload size (health records, audio notes, PDF prescriptions)
    client_max_body_size 50M;

    # Let's Encrypt ACME challenge webroot for automated SSL provisioning
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }

    # --------------------------------------------------------------------------
    # Route /api/ traffic to Spring Boot backend (including WhatsApp Webhook)
    # --------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://backend_service;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Timeouts for zero-wait concurrency operations & webhooks
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        proxy_buffering off;
    }

    # --------------------------------------------------------------------------
    # Route Next.js static asset optimizations with aggressive caching
    # --------------------------------------------------------------------------
    location /_next/static/ {
        proxy_pass http://frontend_service;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        expires 365d;
        access_log off;
    }

    # --------------------------------------------------------------------------
    # Route all other web traffic to Next.js frontend
    # --------------------------------------------------------------------------
    location / {
        proxy_pass http://frontend_service;
        proxy_http_version 1.1;

        # WebSocket support for Next.js real-time updates
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Health check endpoint for VPS uptime monitors
    location /healthz {
        access_log off;
        return 200 "healthy\n";
    }
}
