# ==============================================================================
# Doppsy Production Nginx Reverse Proxy Configuration
# ==============================================================================

upstream backend_service {
    server backend:8080;
    keepalive 32;
}

upstream frontend_service {
    server frontend:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name localhost _;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Performance
    gzip on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Maximum file upload size (health records & documents)
    client_max_body_size 50M;

    # --------------------------------------------------------------------------
    # Route /api/ traffic to Spring Boot backend
    # --------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://backend_service;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Timeouts for zero-wait concurrency operations
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        proxy_buffering off;
    }

    # --------------------------------------------------------------------------
    # Route Next.js static asset optimizations
    # --------------------------------------------------------------------------
    location /_next/static/ {
        proxy_pass http://frontend_service;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        expires 365d;
        access_log off;
    }

    # --------------------------------------------------------------------------
    # Route all other traffic to Next.js frontend
    # --------------------------------------------------------------------------
    location / {
        proxy_pass http://frontend_service;
        proxy_http_version 1.1;

        # WebSocket support for Next.js hot-reload / real-time updates
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Health check endpoint
    location /healthz {
        access_log off;
        return 200 "healthy\n";
    }
}
