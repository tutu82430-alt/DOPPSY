# ==============================================================================
# Doppsy Healthcare Concierge — Continuous Deployment (CD) Pipeline
# ==============================================================================
# Triggers on push to 'main' or manual run via GitHub Actions UI.
# Connects securely via SSH to the Ubuntu VPS, pulls the latest code, and
# rebuilds the production Docker Compose stack with zero downtime.
#
# ------------------------------------------------------------------------------
# HOW TO ADD GITHUB REPOSITORY SECRETS (Fixes 'Error: missing server host'):
# 1. On GitHub.com, navigate to your repository:
#    https://github.com/tutu82430-alt/DOPPSY
# 2. Click 'Settings' (top navigation tab with gear icon).
# 3. In the left sidebar, click 'Secrets and variables' -> 'Actions'.
# 4. Under 'Repository secrets', click 'New repository secret'.
# 5. Add the following 3 REQUIRED secrets:
#
#    SECRET 1: HOST
#    - Name : HOST (or VPS_HOST)
#    - Value: Your Ubuntu VPS public IPv4 address (e.g. 123.45.67.89) or domain.
#
#    SECRET 2: USERNAME
#    - Name : USERNAME (or VPS_USERNAME)
#    - Value: The SSH user on your VPS (typically 'root' or 'ubuntu').
#
#    SECRET 3: KEY
#    - Name : KEY (or SSH_PRIVATE_KEY)
#    - Value: The ENTIRE OpenSSH private key (including '-----BEGIN ... PRIVATE KEY-----'
#             and '-----END ... PRIVATE KEY-----').
#             Ensure the matching public key is in ~/.ssh/authorized_keys on the VPS.
#
#    OPTIONAL SECRETS:
#    - PORT       : Custom SSH port if not using 22 (e.g. 2222).
#    - PASSPHRASE : Passphrase if your private SSH key is password-protected.
# ------------------------------------------------------------------------------

name: Deploy to Production VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Prevent concurrent deployments from colliding
concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Docker Compose Stack
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository Metadata
        uses: actions/checkout@v4

      - name: Validate GitHub Secrets (Pre-flight Check)
        run: |
          echo "Checking required deployment secrets..."
          MISSING=""
          if [ -z "${{ secrets.HOST || secrets.VPS_HOST }}" ]; then
            MISSING="${MISSING} HOST"
          fi
          if [ -z "${{ secrets.USERNAME || secrets.VPS_USERNAME }}" ]; then
            MISSING="${MISSING} USERNAME"
          fi
          if [ -z "${{ secrets.KEY || secrets.SSH_PRIVATE_KEY || secrets.VPS_SSH_KEY }}" ]; then
            MISSING="${MISSING} KEY"
          fi

          if [ -n "$MISSING" ]; then
            echo "::error::Missing required repository secret(s):$MISSING"
            echo "=========================================================================="
            echo "ACTION REQUIRED: Please configure the missing secrets in GitHub:"
            echo "1. Go to: https://github.com/tutu82430-alt/DOPPSY/settings/secrets/actions"
            echo "2. Click 'New repository secret'"
            echo "3. Add the missing secret(s):$MISSING"
            echo "=========================================================================="
            exit 1
          fi
          echo "All required secrets (HOST, USERNAME, KEY) are present. Proceeding to SSH connection."

      - name: Execute Remote Deployment via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HOST || secrets.VPS_HOST }}
          username: ${{ secrets.USERNAME || secrets.VPS_USERNAME }}
          key: ${{ secrets.KEY || secrets.SSH_PRIVATE_KEY || secrets.VPS_SSH_KEY }}
          port: ${{ secrets.PORT || secrets.VPS_PORT || 22 }}
          passphrase: ${{ secrets.PASSPHRASE || '' }}
          script_stop: true
          command_timeout: 15m
          script: |
            set -e

            echo "=========================================================="
            echo " [DOPPSY CD] Starting Automated Deployment on VPS        "
            echo " Timestamp: $(date -u '+%Y-%m-%d %H:%M:%S UTC')           "
            echo "=========================================================="

            # ------------------------------------------------------------------
            # 1. Locate and navigate to project directory
            # ------------------------------------------------------------------
            PROJECT_DIR="/root/doppsy"
            if [ ! -d "$PROJECT_DIR" ]; then
              if [ -d "$HOME/doppsy" ]; then
                PROJECT_DIR="$HOME/doppsy"
              else
                echo "[-] Target directory $PROJECT_DIR not found."
                echo "[-] Performing initial repository clone into $PROJECT_DIR..."
                git clone https://github.com/tutu82430-alt/DOPPSY.git "$PROJECT_DIR"
              fi
            fi

            cd "$PROJECT_DIR"
            echo "[+] Working directory: $(pwd)"

            # ------------------------------------------------------------------
            # 2. Synchronize repository with origin/main
            # ------------------------------------------------------------------
            echo "[+] Fetching latest commit from origin/main..."
            git fetch --prune origin main
            git reset --hard origin/main

            CURRENT_COMMIT=$(git rev-parse --short HEAD)
            COMMIT_MSG=$(git log -1 --pretty=%B | head -n 1)
            echo "[+] Synced to commit: ${CURRENT_COMMIT} ('${COMMIT_MSG}')"

            # ------------------------------------------------------------------
            # 3. Detect Docker Compose Command (V2 plugin vs legacy binary)
            # ------------------------------------------------------------------
            if docker compose version >/dev/null 2>&1; then
              COMPOSE_CMD="docker compose"
            elif command -v docker-compose >/dev/null 2>&1; then
              COMPOSE_CMD="docker-compose"
            else
              echo "[!] Error: Neither 'docker compose' nor 'docker-compose' found on VPS."
              echo "[!] Please install Docker Compose: sudo apt-get update && sudo apt-get install -y docker-compose-plugin"
              exit 1
            fi
            echo "[+] Using Compose CLI: $COMPOSE_CMD"

            # ------------------------------------------------------------------
            # 4. Rebuild & Deploy Containers
            # ------------------------------------------------------------------
            echo "[+] Rebuilding and launching production stack in background..."
            $COMPOSE_CMD -f docker-compose.prod.yml up --build -d --remove-orphans

            # ------------------------------------------------------------------
            # 5. Clean Dangling Docker Images (Disk Space Management)
            # ------------------------------------------------------------------
            echo "[+] Pruning untagged build cache images..."
            docker image prune -f

            # ------------------------------------------------------------------
            # 6. Service Verification
            # ------------------------------------------------------------------
            echo "[+] Verifying running containers..."
            $COMPOSE_CMD -f docker-compose.prod.yml ps

            echo "=========================================================="
            echo " [DOPPSY CD] Deployment completed successfully!          "
            echo "=========================================================="
